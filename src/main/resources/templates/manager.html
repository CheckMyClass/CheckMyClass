<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>CheckMyClass - 관리자</title>
    <link rel="stylesheet" href="/globals.css" />
    <link rel="stylesheet" href="/styleguide.css" />
    <link rel="stylesheet" href="/style.css" />
    <style>
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }
        .action-form {
            display: inline-block;
            width: auto;
            flex: 1;
        }
        .reservation {
            min-width: 500px;
        }
        .stats-section {
            width: 350px;
            margin: 20px 0;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #ddd;
        }
        .stats-title {
            font-weight: 800;
            font-size: 18px;
            color: var(--main);
            margin-bottom: 15px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background-color: var(--main);
            color: white;
            padding: 8px;
            text-align: center;
        }
        td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        .flash-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px 20px;
            margin: 10px 20px;
            border-radius: 8px;
        }
        .status-WAITING  { color: orange; font-weight: bold; }
        .status-APPROVED { color: green;  font-weight: bold; }
        .status-REJECTED { color: red;    font-weight: bold; }

        /* 🌟 추가된 페이징 버튼 디자인 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }
        .page-btn {
            padding: 5px 12px;
            border: 1px solid #ddd;
            background-color: white;
            color: #333;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }
        .page-btn:hover {
            background-color: #f5f5f5;
        }
        .page-btn.active {
            background-color: var(--main);
            color: white;
            border-color: var(--main);
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="manager">
    <header class="header">
        <div class="frame">
            <a href="/main"><img class="checkmyclass-x" src="/Logo_img.png" alt="로고" /></a>
        </div>
        <img class="check-my-class" src="/Logo_eng.png" alt="CheckMyClass" />
    </header>

    <div th:if="${message}" class="flash-message" th:text="${message}"></div>

    <h2 style="padding: 20px 0 0 20px; color: #333;">승인 대기 목록</h2>

    <div th:if="${#lists.isEmpty(waitingList)}"
         style="padding: 40px; text-align: center; color: #888;">
        현재 승인 대기 중인 예약 요청이 없습니다.
    </div>

    <div th:each="r : ${waitingList}" class="reservation">
        <div class="info-container">
            <div class="user-info">
                <span class="user-label">예약자</span>
                <div class="user-value">
                    <span th:text="${r.user.major != null ? r.user.major.majorName : ''}"></span><br />
                    <span th:text="${r.user.studentNumber + ' ' + r.user.userName}"></span>
                </div>
            </div>
            <div class="info-row">
                <span class="label">예약일</span>
                <span class="value"
                      th:text="${#temporals.format(r.reservationDate, 'yyyy년 M월 d일')}"></span>
            </div>
            <div class="info-row">
                <span class="label">예약시간</span>
                <span class="value"
                      th:text="${#strings.substring(r.startTime.toString(), 0, 5)
                               + ' ~ '
                               + #strings.substring(r.endTime.toString(), 0, 5)}"></span>
            </div>
            <div class="info-row">
                <span class="label">강의실</span>
                <span class="value" th:text="${r.classroom.classNumber + '호'}"></span>
            </div>
            <div class="info-row">
                <span class="label">대여 목적</span>
                <div class="purpose-box" th:text="${r.purpose}"></div>
            </div>
        </div>

        <div class="btn-container">
            <form action="/manager/approve" method="POST" class="action-form"
                  onsubmit="return confirm('승인하시겠습니까?');">
                <input type="hidden" name="reservationId" th:value="${r.id}" />
                <button type="submit" class="approve-btn">승인</button>
            </form>
            <form action="/manager/reject" method="POST" class="action-form"
                  onsubmit="return confirm('반려하시겠습니까?');">
                <input type="hidden" name="reservationId" th:value="${r.id}" />
                <button type="submit" class="reject-btn">반려</button>
            </form>
        </div>
    </div>

    <div class="stats-section">
        <div class="stats-title">최신 예약 현황 (전체)</div>
        <table>
            <thead>
            <tr>
                <th>강의실</th>
                <th>날짜</th>
                <th>시간</th>
                <th>예약자</th>
                <th>상태</th>
            </tr>
            </thead>
            <tbody id="reservation-tbody">
            <tr th:each="r : ${allReservations}">
                <td th:text="${r.classroom != null ? r.classroom.classNumber + '호' : '강의실 미정'}"></td>                    <td th:text="${#temporals.format(r.reservationDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${#strings.substring(r.startTime.toString(), 0, 5)
                                 + '~'
                                 + #strings.substring(r.endTime.toString(), 0, 5)}"></td>
                <td th:text="${r.user.userName}"></td>
                <td>
                        <span th:class="'status-' + ${r.status.name()}"
                              th:text="${r.status.name() == 'WAITING' ? '대기' :
                                        r.status.name() == 'APPROVED' ? '승인' : '반려'}"></span>
                </td>
            </tr>
            </tbody>
        </table>
        <div id="pagination" class="pagination"></div>
    </div>

    <div class="stats-section">
        <div class="stats-title">인기 강의실 TOP 현황</div>
        <table>
            <thead>
            <tr>
                <th>강의실</th>
                <th>예약 횟수</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${stats}">
                <td th:text="${s[0] + '호'}"></td>
                <td th:text="${s[1] + '회'}"></td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const rowsPerPage = 10; // 10개씩 보여주기
        const rows = document.querySelectorAll('#reservation-tbody tr');
        const rowsCount = rows.length;
        const pageCount = Math.ceil(rowsCount / rowsPerPage);
        const paginationContainer = document.getElementById('pagination');

        function displayPage(page) {
            rows.forEach(row => row.style.display = 'none');
            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            for (let i = start; i < end && i < rowsCount; i++) {
                rows[i].style.display = '';
            }

            document.querySelectorAll('.page-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-page-' + page);
            if(activeBtn) activeBtn.classList.add('active');
        }

        for (let i = 1; i <= pageCount; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.id = 'btn-page-' + i;
            btn.classList.add('page-btn');
            btn.addEventListener('click', function() {
                displayPage(i);
            });
            paginationContainer.appendChild(btn);
        }

        if(pageCount > 0) {
            displayPage(1); // 처음에 1페이지 딱 보여주기
        }
    });
</script>
</body>
</html>
