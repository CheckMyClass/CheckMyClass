<!DOCTYPE html>
<!-- 관리자 - 승인 대기 목록 페이지 (승인/반려 처리) -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>CheckMyClass - 예약 요청 내역</title>
    <link rel="stylesheet" href="/global.css" />
    <link rel="stylesheet" href="/styleguide.css" />
    <link rel="stylesheet" href="/style.css" />
    <style>
        /* 공통 사이드바 */
        .sidebar { position: fixed; top: 0; left: 0; width: 240px; height: 100vh; background-color: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; padding-top: 30px; z-index: 9999; }
        .sidebar-logo { text-align: center; margin-bottom: 30px; }
        .sidebar-logo img { width: 140px; cursor: pointer; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-menu a { display: block; padding: 15px 30px; color: #555; text-decoration: none; font-size: 16px; font-weight: bold; transition: all 0.3s ease; border-radius: 0 30px 30px 0; margin-right: 20px; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: var(--main, #0056b3); color: #ffffff; box-shadow: 2px 2px 8px rgba(0,0,0,0.1); }
        .content-area { margin-left: 240px; width: calc(100% - 240px); padding: 30px 40px; min-height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; }

        .top-logo-container { width: 100%; text-align: center; margin-bottom: 10px; display: flex; justify-content: center; }
        .top-logo { height: 35px; object-fit: contain; }
        .hamburger-btn { display: none; position: fixed; top: 15px; left: 15px; z-index: 10000; background-color: var(--main, #0056b3); color: white; border: none; padding: 10px 15px; font-size: 18px; border-radius: 8px; cursor: pointer; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 9998; }

        @media (max-width: 768px) {
            .hamburger-btn { display: block; }
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease-in-out; }
            .sidebar.active { transform: translateX(0); }
            .content-area { margin-left: 0; width: 100%; padding-top: 70px; padding-left: 15px; padding-right: 15px; }
            .sidebar-overlay.active { display: block; }
        }

        /* 예약 요청 카드 & 승인/반려 버튼 */
        .manager { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        .reservation { width: 100%; background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-container { display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end; }
        .action-form { display: inline-block; flex: 1; }
        .approve-btn, .reject-btn { width: 100%; padding: 10px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
        .approve-btn { background-color: #28a745; }
        .reject-btn { background-color: #dc3545; }
        .flash-message { width: 100%; background-color: #d4edda; color: #155724; padding: 12px 20px; margin-bottom: 20px; border-radius: 8px; }

        .info-row { display: flex; margin-bottom: 8px; }
        .info-row .label { font-weight: bold; width: 100px; color: #555; }
        .purpose-box { padding: 10px; background: #f9f9f9; border-radius: 5px; width: 100%; }
        .user-info { display: flex; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .user-label { font-weight: bold; width: 100px; color: #555; }
        .user-value { font-weight: bold; color: var(--main, #0056b3); }
    </style>
</head>
<body>

<button id="hamburgerBtn" class="hamburger-btn">☰ 메뉴</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<!-- 관리자 전용 네비게이션 메뉴 -->
<nav class="sidebar">
    <div class="sidebar-logo">
        <img src="/Logo_img.png" alt="CheckMyClass 로고" />
    </div>
    <ul class="sidebar-menu">
        <li><a th:href="@{/manager}" class="active">📥 예약 요청 내역</a></li>
        <li><a th:href="@{/manager/history}">📊 전체 예약 현황</a></li>
    </ul>
</nav>

<div class="content-area">

    <div class="top-logo-container">
        <img src="/Logo_eng.png" alt="Check My Class" class="top-logo" />
    </div>

    <div class="manager">

        <h2 style="width: 100%; text-align: center; margin-bottom: 20px; color: var(--main, #0056b3);">승인 대기 목록</h2>

        <div th:if="${message}" class="flash-message" th:text="${message}"></div>

        <!-- 대기 중인 예약이 없을 때 -->
        <div th:if="${#lists.isEmpty(waitingList)}" style="padding: 40px; text-align: center; color: #888;">
            현재 승인 대기 중인 예약 요청이 없습니다.
        </div>

        <!-- 승인 대기 예약 카드 목록 -->
        <div th:each="r : ${waitingList}" class="reservation">
            <div class="info-container">
                <div class="user-info">
                    <span class="user-label">예약자</span>
                    <div class="user-value">
                        <span th:text="${r.user.major != null ? r.user.major.majorName : ''}"></span>
                        <span th:text="${r.user.studentNumber + ' ' + r.user.userName}"></span>
                    </div>
                </div>
                <div class="info-row">
                    <span class="label">예약일</span>
                    <span class="value" th:text="${#temporals.format(r.reservationDate, 'yyyy년 M월 d일')}"></span>
                </div>
                <div class="info-row">
                    <span class="label">예약시간</span>
                    <span class="value" th:text="${#strings.substring(r.startTime.toString(), 0, 5) + ' ~ ' + #strings.substring(r.endTime.toString(), 0, 5)}"></span>
                </div>
                <div class="info-row">
                    <span class="label">강의실</span>
                    <span class="value" th:text="${r.classroom.classNumber + '호'}"></span>
                </div>
                <div class="info-row">
                    <span class="label">대여 목적</span>
                    <div class="purpose-box" th:text="${r.purpose}"></div>
                </div>
            </div>

            <!-- 승인 / 반려 버튼 (각각 별도 폼으로 전송) -->
            <div class="btn-container">
                <form action="/manager/approve" method="POST" class="action-form" onsubmit="return confirm('승인하시겠습니까?');">
                    <input type="hidden" name="reservationId" th:value="${r.id}" />
                    <button type="submit" class="approve-btn">승인</button>
                </form>
                <form action="/manager/reject" method="POST" class="action-form" onsubmit="return confirm('반려하시겠습니까?');">
                    <input type="hidden" name="reservationId" th:value="${r.id}" />
                    <button type="submit" class="reject-btn">반려</button>
                </form>
            </div>
        </div>

    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // 모바일 햄버거 메뉴 토글
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.getElementById("sidebarOverlay");
        hamburgerBtn.addEventListener("click", () => { sidebar.classList.add("active"); overlay.classList.add("active"); hamburgerBtn.style.display = "none"; });
        overlay.addEventListener("click", () => { sidebar.classList.remove("active"); overlay.classList.remove("active"); hamburgerBtn.style.display = "block"; });
    });
</script>
</body>
</html>
