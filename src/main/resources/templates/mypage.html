<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>CheckMyClass - 마이페이지</title>
    <link rel="stylesheet" href="/global.css" />
    <link rel="stylesheet" href="/styleguide.css" />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
<main class="mypage">
    <header class="header">
        <div class="frame">
            <a href="/"><img class="checkmyclass-x" src="/Logo_img.png" alt="CheckMyClass 로고" /></a>
        </div>
        <img class="check-my-class" src="/Logo_eng.png" alt="Check My Class" />
    </header>

    <section class="profile">
        <div class="div">
            <div class="view" role="img" aria-label="프로필 이미지">
                <img class="deu" src="/Logo_dongeui.png" alt="Logo_dongeui" />
            </div>
            <p class="text-wrapper">
                <span th:text="${session.department != null ? session.department : '컴퓨터공학과'}">학과명</span><br />
                <span th:text="${session.user_name != null ? session.user_name : '테스트유저'}">사용자 이름</span>
            </p>
        </div>
        <div class="div-wrapper">
            <span class="text-wrapper-2" th:text="${session.role == 'STUDENT' ? '학생회원' : '교직원'}">학생회원</span>
        </div>
    </section>

    <section class="view-2">
        <h1 class="text-wrapper-3"  style="margin: 10px 0;">예약 내역</h1>
    </section>
    <hr class="line" />

    <div th:if="${!#lists.isEmpty(historyList)}">
        <article class="reservation" th:each="res : ${historyList}" th:aria-label="'예약 정보 - ' + ${res.reservationDate}">
            <dl class="frame-2">
                <div class="frame-3">
                    <dt class="text-wrapper-4">예약일</dt>
                    <dd class="input">
                        <span class="text-wrapper-5" th:text="${#temporals.format(res.reservationDate, 'yyyy년 M월 d일')}">2026년 5월 22일</span>
                    </dd>
                </div>
                <div class="frame-3">
                    <dt class="text-wrapper-4">예약시간</dt>
                    <dd class="input">
                        <span class="text-wrapper-5" th:text="${#temporals.format(res.startTime, 'HH:mm')} + '~' + ${#temporals.format(res.endTime, 'HH:mm')}">14:00~16:00</span>
                    </dd>
                </div>
                <div class="frame-3">
                    <dt class="text-wrapper-4">강의실</dt>
                    <dd class="input">
                        <span class="text-wrapper-5" th:text="${res.classroom.id} + '호'">401호</span>
                    </dd>
                </div>
                <div class="frame-3">
                    <dt class="text-wrapper-4">대여 목적</dt>
                    <dd class="input-2">
                        <span class="text-wrapper-5" th:text="${res.purpose}">팀 프로젝트 회의</span>
                    </dd>
                </div>
            </dl>

            <div th:class="${res.status == 'WAITING' ? 'status-waiting' : (res.status == 'APPROVED' ? 'status-approved' : 'status-rejected')}"
                 role="status" th:aria-label="'예약 상태: ' + ${res.status}">
              <span class="text-wrapper-7"
                    th:text="${res.status == 'WAITING' ? '대기' : (res.status == 'APPROVED' ? '승인됨' : '반려')}">
                  대기
              </span>
            </div>
        </article>
    </div>

    <div th:if="${#lists.isEmpty(historyList)}">
        <p style="text-align:center; padding: 50px; color: #888; font-size: 16px;">예약 내역이 없습니다.</p>
    </div>

</main>
</body>
</html>
