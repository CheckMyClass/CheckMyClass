<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>CheckMyClass - 전체 예약 현황</title>
    <link rel="stylesheet" href="/globals.css" />
    <link rel="stylesheet" href="/styleguide.css" />
    <link rel="stylesheet" href="/style.css" />
    <style>
        /* 🌟 공통 패널 CSS */
        .sidebar { position: fixed; top: 0; left: 0; width: 240px; height: 100vh; background-color: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; padding-top: 30px; z-index: 9999; }
        .sidebar-logo { text-align: center; margin-bottom: 30px; }
        .sidebar-logo img { width: 140px; cursor: pointer; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-menu a { display: block; padding: 15px 30px; color: #555; text-decoration: none; font-size: 16px; font-weight: bold; transition: all 0.3s ease; border-radius: 0 30px 30px 0; margin-right: 20px; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: var(--main, #0056b3); color: #ffffff; box-shadow: 2px 2px 8px rgba(0,0,0,0.1); }
        .content-area { margin-left: 240px; width: calc(100% - 240px); padding: 30px 40px; min-height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; }

        .hamburger-btn { display: none; position: fixed; top: 15px; left: 15px; z-index: 10000; background-color: var(--main, #0056b3); color: white; border: none; padding: 10px 15px; font-size: 18px; border-radius: 8px; cursor: pointer; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 9998; }
        .top-logo-container { width: 100%; text-align: center; margin-bottom: 10px; display: flex; justify-content: center; }
        .top-logo { height: 35px; object-fit: contain; }

        @media (max-width: 768px) {
            .hamburger-btn { display: block; }
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease-in-out; }
            .sidebar.active { transform: translateX(0); }
            .content-area { margin-left: 0; width: 100%; padding-top: 70px; padding-left: 10px; padding-right: 10px; }
            .sidebar-overlay.active { display: block; }
            .top-logo { height: 28px; }
            .top-logo-container { margin-bottom: 5px; }
        }

        /* 🌟 전체 현황 테이블 디자인 */
        .stats-section { width: 100%; max-width: 900px; margin: 20px 0; background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .stats-title { font-weight: 800; font-size: 22px; color: var(--main, #0056b3); margin-bottom: 20px; text-align: left; border-bottom: 2px solid #f1f1f1; padding-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 15px; }
        th { background-color: var(--main, #0056b3); color: white; padding: 12px; text-align: center; font-weight: 600; }
        td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; color: #444; }
        tr:hover { background-color: #f8f9fa; }
        .flash-message { width: 100%; max-width: 900px; background-color: #d4edda; color: #155724; padding: 12px 20px; margin-bottom: 20px; border-radius: 8px; font-weight: bold; }

        /* 페이징 버튼 */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .page-btn { padding: 6px 14px; border: 1px solid #ddd; background-color: white; color: #333; cursor: pointer; border-radius: 5px; font-size: 14px; transition: all 0.2s; }
        .page-btn:hover { background-color: #f5f5f5; }
        .page-btn.active { background-color: var(--main, #0056b3); color: white; border-color: var(--main, #0056b3); font-weight: bold; }

        /* 🌟 콤보박스 스타일 */
        .status-select { padding: 5px 10px; border-radius: 5px; font-weight: bold; border: 1px solid #ccc; cursor: pointer; outline: none; }
        .status-WAITING { color: #f39c12; }
        .status-APPROVED { color: #28a745; }
        .status-REJECTED { color: #dc3545; }
    </style>
</head>
<body>

<button id="hamburgerBtn" class="hamburger-btn">☰ 메뉴</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<nav class="sidebar">
    <div class="sidebar-logo">
        <img src="/Logo_img.png" alt="CheckMyClass 로고" />
    </div>
    <ul class="sidebar-menu">
        <li><a th:href="@{/manager}">📥 예약 요청 내역</a></li>
        <li><a th:href="@{/manager/history}" class="active">📊 전체 예약 현황</a></li>
    </ul>
</nav>

<div class="content-area">
    <div class="top-logo-container">
        <img src="/Logo_eng.png" alt="Check My Class" class="top-logo" />
    </div>

    <div th:if="${message}" class="flash-message" th:text="${message}"></div>

    <div class="stats-section">
        <div class="stats-title">전체 예약 현황 목록</div>
        <table>
            <thead>
            <tr>
                <th>강의실</th>
                <th>날짜</th>
                <th>시간</th>
                <th>예약자</th>
                <th>상태 관리</th>
            </tr>
            </thead>
            <tbody id="reservation-tbody">
            <tr th:each="r : ${allReservations}">
                <td th:text="${r.classroom != null ? r.classroom.classNumber + '호' : '강의실 미정'}"></td>
                <td th:text="${#temporals.format(r.reservationDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${#strings.substring(r.startTime.toString(), 0, 5) + ' ~ ' + #strings.substring(r.endTime.toString(), 0, 5)}"></td>
                <td th:text="${r.user.userName}"></td>
                <td>
                    <th:block th:if="${r.reservationDate.isAfter(T(java.time.LocalDate).now()) or (r.reservationDate.isEqual(T(java.time.LocalDate).now()) and r.startTime.isAfter(T(java.time.LocalTime).now()))}">

                        <form th:action="@{/manager/update-status}" method="POST" style="margin: 0;">
                            <input type="hidden" name="reservationId" th:value="${r.id}" />
                            <select name="newStatus" class="status-select" onchange="this.form.submit()">
                                <option value="WAITING" th:selected="${r.status.name() == 'WAITING'}" class="status-WAITING">대기</option>
                                <option value="APPROVED" th:selected="${r.status.name() == 'APPROVED'}" class="status-APPROVED">승인</option>
                                <option value="REJECTED" th:selected="${r.status.name() == 'REJECTED'}" class="status-REJECTED">반려</option>
                            </select>
                        </form>

                    </th:block>

                    <th:block th:unless="${r.reservationDate.isAfter(T(java.time.LocalDate).now()) or (r.reservationDate.isEqual(T(java.time.LocalDate).now()) and r.startTime.isAfter(T(java.time.LocalTime).now()))}">
                        <span th:class="'status-' + ${r.status.name()}"
                              th:text="${r.status.name() == 'WAITING' ? '대기 (만료)' : (r.status.name() == 'APPROVED' ? '승인' : '반려')}"
                              style="font-weight: bold; opacity: 0.7;">
                        </span>
                    </th:block>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(allReservations)}" style="padding: 30px; text-align: center; color: #888;">
            예약 내역이 존재하지 않습니다.
        </div>

        <div id="pagination" class="pagination"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 🌟 1. 모바일 햄버거
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.getElementById("sidebarOverlay");
        hamburgerBtn.addEventListener("click", () => { sidebar.classList.add("active"); overlay.classList.add("active"); hamburgerBtn.style.display = "none"; });
        overlay.addEventListener("click", () => { sidebar.classList.remove("active"); overlay.classList.remove("active"); hamburgerBtn.style.display = "block"; });

        // 🌟 2. 10개씩 자르기 페이징
        const rowsPerPage = 10;
        const rows = document.querySelectorAll('#reservation-tbody tr');
        const rowsCount = rows.length;
        const pageCount = Math.ceil(rowsCount / rowsPerPage);
        const paginationContainer = document.getElementById('pagination');

        function displayPage(page) {
            rows.forEach(row => row.style.display = 'none');
            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            for (let i = start; i < end && i < rowsCount; i++) {
                rows[i].style.display = '';
            }
            document.querySelectorAll('.page-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-page-' + page);
            if(activeBtn) activeBtn.classList.add('active');
        }

        for (let i = 1; i <= pageCount; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.id = 'btn-page-' + i;
            btn.classList.add('page-btn');
            btn.addEventListener('click', function() { displayPage(i); });
            paginationContainer.appendChild(btn);
        }

        if(pageCount > 0) displayPage(1);
    });
</script>
</body>
</html>
