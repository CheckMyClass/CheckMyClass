<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>CheckMyClass - 마이페이지</title>
    <link rel="stylesheet" href="/globals.css" />
    <link rel="stylesheet" href="/styleguide.css" />
    <link rel="stylesheet" href="/style.css" />

    <style>
        /* 패널 & 본문 기본 레이아웃 */
        .sidebar {
            position: fixed; top: 0; left: 0; width: 240px; height: 100vh;
            background-color: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; padding-top: 30px; z-index: 9999;
        }
        .sidebar-logo { text-align: center; margin-bottom: 30px; }
        .sidebar-logo img { width: 140px; cursor: pointer; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-menu a {
            display: block; padding: 15px 30px; color: #555; text-decoration: none;
            font-size: 16px; font-weight: bold; transition: all 0.3s ease; border-radius: 0 30px 30px 0; margin-right: 20px;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: var(--main, #0056b3); color: #ffffff; }

        .content-area {
            margin-left: 240px; padding: 30px 40px; min-height: 100vh; background-color: #fffff;
            display: flex; flex-direction: column; align-items: center;
        }
        .top-logo-container { width: 100%; text-align: center; margin-bottom: 30px; display: flex; justify-content: center; }
        .top-logo { height: 35px; object-fit: contain; }

        /* 👤 개인정보 카드 패널 스타일 */
        .profile-card {
            width: 90%; max-width: 500px; background: white; border-radius: 20px;
            padding: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center;
            margin-top: 20px;
        }
        .profile-avatar {
            width: 90px; height: 90px; background-color: #e3f2fd; border-radius: 50%;
            margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center;
        }
        .profile-avatar img { width: 55px; height: auto; }

        .profile-title { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .profile-badge {
            display: inline-block; padding: 5px 15px; background-color: var(--main, #0056b3);
            color: white; border-radius: 15px; font-size: 13px; font-weight: bold; margin-bottom: 30px;
        }

        .info-table { width: 100%; text-align: left; border-spacing: 0 15px; }
        .info-label { font-size: 15px; color: #888; font-weight: bold; width: 30%; }
        .info-value { font-size: 16px; color: #333; font-weight: 500; }

        /* 모바일 반응형 */
        .hamburger-btn {
            display: none; position: fixed; top: 15px; left: 15px; z-index: 10000;
            background-color: var(--main, #0056b3); color: white; border: none; padding: 10px 15px; font-size: 18px; border-radius: 8px; cursor: pointer;
        }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 9998; }

        @media (max-width: 768px) {
            .hamburger-btn { display: block; }
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease-in-out; }
            .sidebar.active { transform: translateX(0); }
            .content-area { margin-left: 0; padding-top: 60px; }
            .sidebar-overlay.active { display: block; }
        }
    </style>
</head>
<body>

<button id="hamburgerBtn" class="hamburger-btn">☰ 메뉴</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<nav class="sidebar">
    <div class="sidebar-logo">
        <a th:href="@{/main}"><img src="/Logo_img.png" alt="CheckMyClass 로고" /></a>
    </div>
    <ul class="sidebar-menu">
        <li><a th:href="@{/main}">🏠 메인 홈</a></li>
        <li><a th:href="@{/reservation}">📅 예약 신청</a></li>
        <li><a th:href="@{/mypage/history}">📋 예약 현황</a></li>
        <li><a th:href="@{/mypage/profile}" class="active">👤 마이페이지</a></li> </ul>
</nav>

<div class="content-area">
    <div class="top-logo-container">
        <img src="/Logo_eng.png" alt="Check My Class" class="top-logo" />
    </div>

    <div class="profile-card">
        <div class="profile-avatar">
            <img src="/Logo_dongeui.png" alt="학교 로고" />
        </div>
        <div class="profile-title" th:text="${user.userName}">홍길동</div>
        <div class="profile-badge" th:text="${user.role.name() == 'STUDENT' ? '학생회원' : (user.role.name() == 'PROFESSOR' ? '교직원' : '일반회원')}">학생회원</div>

        <table class="info-table">
            <tr>
                <td class="info-label">학번 / 교번</td>
                <td class="info-value" th:text="${user.userId}">202612345</td>
            </tr>
            <tr>
                <td class="info-label">소속 학과</td>
                <td class="info-value" th:text="${user.major != null ? user.major.majorName : '소속 학과 없음'}">컴퓨터공학과</td>
            </tr>
        </table>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.getElementById("sidebarOverlay");

        hamburgerBtn.addEventListener("click", () => {
            sidebar.classList.add("active");
            overlay.classList.add("active");
            hamburgerBtn.style.display = "none";
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("active");
            overlay.classList.remove("active");
            hamburgerBtn.style.display = "block";
        });
    });
</script>
</body>
</html>
