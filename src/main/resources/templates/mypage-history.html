<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>CheckMyClass - 예약 현황</title>
    <link rel="stylesheet" href="/global.css" />
    <link rel="stylesheet" href="/styleguide.css" />
    <link rel="stylesheet" href="/style.css" />

    <style>
        /* =========================================
           🌟 1. 공통 사이드바 & 모바일 반응형
           ========================================= */
        .sidebar { position: fixed; top: 0; left: 0; width: 240px; height: 100vh; background-color: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; padding-top: 30px; z-index: 9999; }
        .sidebar-logo { text-align: center; margin-bottom: 30px; }
        .sidebar-logo img { width: 140px; cursor: pointer; }

        .sidebar-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-menu a { display: block; padding: 15px 30px; color: #555; text-decoration: none; font-size: 16px; font-weight: bold; transition: all 0.3s ease; border-radius: 0 30px 30px 0; margin-right: 20px; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: var(--main, #0056b3); color: #ffffff; box-shadow: 2px 2px 8px rgba(0,0,0,0.1); }

        /* =========================================
           🌟 2. 본문 영역 & 피그마 충돌 완벽 방어
           ========================================= */
        .content-area {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px 40px;
            min-height: 100vh;
            background-color: #ffffff; /* 🌟 배경 완벽한 흰색으로 통일! */
            display: flex; flex-direction: column; align-items: center;
        }

        /* 피그마의 좁은 고정 크기와 강제 흰색 배경 무력화 */
        .mypage {
            width: 100% !important;
            max-width: 800px !important;
            background-color: transparent !important;
            display: flex !important; flex-direction: column !important; align-items: center !important;
        }

        /* 각 섹션들이 세로로 찌그러지지 않게 넓게 펴줌 */
        .mypage > section, .mypage > div { width: 100%; max-width: 800px; }

        /* 🌟 상단 로고 간격 줄임 반영! (30px -> 10px) */
        .top-logo-container { width: 100%; text-align: center; margin-bottom: 10px; display: flex; justify-content: center; }
        .top-logo { height: 35px; object-fit: contain; }

        /* =========================================
           📱 3. 모바일 반응형
           ========================================= */
        .hamburger-btn { display: none; position: fixed; top: 15px; left: 15px; z-index: 10000; background-color: var(--main, #0056b3); color: white; border: none; padding: 10px 15px; font-size: 18px; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 9998; }

        @media (max-width: 768px) {
            .hamburger-btn { display: block; }
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease-in-out; }
            .sidebar.active { transform: translateX(0); }
            .content-area {
                margin-left: 0;
                width: 100%;
                padding-top: 70px; padding-left: 15px; padding-right: 15px;
            }
            .sidebar-overlay.active { display: block; }
            .top-logo { height: 28px; }
            .top-logo-container { margin-bottom: 5px; } /* 모바일 로고 간격도 축소 */
        }
    </style>
</head>

<body>

<button id="hamburgerBtn" class="hamburger-btn">☰ 메뉴</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<nav class="sidebar">
    <div class="sidebar-logo">
        <a th:href="@{/main}"><img src="/Logo_img.png" alt="CheckMyClass 로고" /></a>
    </div>
    <ul class="sidebar-menu">
        <li><a th:href="@{/main}">🏠 메인 홈</a></li>
        <li><a th:href="@{/reservation}">📅 예약 신청</a></li>
        <li><a th:href="@{/mypage/history}" class="active">📋 예약 현황</a></li> <li><a th:href="@{/mypage/profile}">👤 마이페이지</a></li>
    </ul>
</nav>

<div class="content-area">

    <div class="top-logo-container">
        <img src="/Logo_eng.png" alt="Check My Class" class="top-logo" />
    </div>

    <main class="mypage">

        <section class="profile">
            <div class="div">
                <div class="view" role="img" aria-label="프로필 이미지">
                    <img class="deu" src="/Logo_dongeui.png" alt="Logo_dongeui" />
                </div>
                <p class="text-wrapper">
                    <span th:text="${user.major != null ? user.major.majorName : '소속 학과 없음'}">학과명</span><br />
                    <span th:text="${user.userName}">사용자 이름</span>
                </p>
            </div>
            <div class="div-wrapper">
                <span class="text-wrapper-2" th:text="${user.role.name() == 'STUDENT' ? '학생회원' : (user.role.name() == 'PROFESSOR' ? '교직원' : '회원')}">회원등급</span>
            </div>
        </section>

        <section class="view-2">
            <h1 class="text-wrapper-3" style="margin: 10px 0; font-size: 24px;">예약 내역</h1>
        </section>
        <hr class="line" style="width: 100%; border: 0; border-top: 1px solid #ddd; margin-bottom: 20px;" />

        <div th:if="${!#lists.isEmpty(historyList)}" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <article class="reservation" th:each="res : ${historyList}" th:aria-label="'예약 정보 - ' + ${res.reservationDate}" style="margin-bottom: 15px;">
                <dl class="frame-2">
                    <div class="frame-3">
                        <dt class="text-wrapper-4">예약일</dt>
                        <dd class="input">
                            <span class="text-wrapper-5" th:text="${#temporals.format(res.reservationDate, 'yyyy년 M월 d일')}">2026년 5월 22일</span>
                        </dd>
                    </div>
                    <div class="frame-3">
                        <dt class="text-wrapper-4">예약시간</dt>
                        <dd class="input">
                            <span class="text-wrapper-5" th:text="${#temporals.format(res.startTime, 'HH:mm')} + '~' + ${#temporals.format(res.endTime, 'HH:mm')}">14:00~16:00</span>
                        </dd>
                    </div>
                    <div class="frame-3">
                        <dt class="text-wrapper-4">강의실</dt>
                        <dd class="input">
                            <span class="text-wrapper-5" th:text="${res.classroom.classNumber} + '호'">401호</span>
                        </dd>
                    </div>
                    <div class="frame-3">
                        <dt class="text-wrapper-4">대여 목적</dt>
                        <dd class="input-2">
                            <span class="text-wrapper-5" th:text="${res.purpose}">팀 프로젝트 회의</span>
                        </dd>
                    </div>
                </dl>

                <div th:class="${res.status.name() == 'WAITING' ? 'status-waiting' : (res.status.name() == 'APPROVED' ? 'status-approved' : 'status-rejected')}"
                     role="status" th:aria-label="'예약 상태: ' + ${res.status.name()}">
                    <span class="text-wrapper-7"
                          th:text="${res.status.name() == 'WAITING' ? '대기' : (res.status.name() == 'APPROVED' ? '승인' : '반려')}">
                    </span>
                </div>

                <th:block th:if="${res.reservationDate.isAfter(T(java.time.LocalDate).now()) or (res.reservationDate.isEqual(T(java.time.LocalDate).now()) and res.startTime.isAfter(T(java.time.LocalTime).now()))}">
                    <form th:action="@{/reservation/cancel}" method="POST" onsubmit="return confirm('정말 예약을 취소하시겠습니까? (취소 시 복구할 수 없습니다.)');" style="margin-top: 15px; text-align: right; width: 100%;">
                        <input type="hidden" name="reservationId" th:value="${res.id}" />
                        <button type="submit" style="padding: 8px 16px; background-color: #dc3545; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;">
                            🗑️ 예약 취소
                        </button>
                    </form>
                </th:block>

            </article> </div>
    </main>

</div> <script th:if="${message}" th:inline="javascript">
    alert([[${message}]]);
</script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // 🌟 모바일 햄버거 메뉴 토글 로직 추가
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.getElementById("sidebarOverlay");

        if (hamburgerBtn && sidebar && overlay) {
            hamburgerBtn.addEventListener("click", () => {
                sidebar.classList.add("active");
                overlay.classList.add("active");
                hamburgerBtn.style.display = "none";
            });

            overlay.addEventListener("click", () => {
                sidebar.classList.remove("active");
                overlay.classList.remove("active");
                hamburgerBtn.style.display = "block";
            });
        }
    });
</script>

</body>
</html>
