<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>CheckMyClass - 회원가입</title>
  <link rel="stylesheet" href="/globals.css" />
  <link rel="stylesheet" href="/styleguide.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="register">
  <header class="header">
    <div class="frame">
      <img class="checkmyclass-x" src="/Logo_img.png" alt="CheckMyClass 로고" />
    </div>
    <img class="check-my-class" src="/Logo_eng.png" alt="Check My Class" />
  </header>
  <main class="view">
    <section class="login">
      <p class="text-wrapper">
        회원가입을 위한 정보를 입력해주세요<br />비밀번호는 암호화되어 보관됩니다
      </p>

      <form class="info" method="post" action="/register">
        <label class="div" for="name">이름</label>
        <div class="input">
          <input class="frame-2" type="text" id="name" name="userName" required aria-required="true" autocomplete="name" />
        </div>

        <label class="text-wrapper-2" for="student-id">학번/교번</label>
        <div class="frame-3">
          <div class="frame-wrapper">
            <input class="frame-2" type="text" id="student-id" name="studentNumber" required aria-required="true" autocomplete="off" />
          </div>
          <div class="frame-4">
            <label class="text-wrapper-2" for="is-staff">교직원</label>
            <div class="check-box-outline">
              <input class="icon" type="checkbox" id="is-staff" name="role" value="PROFESSOR" />
            </div>
          </div>
        </div>

        <label class="text-wrapper-2" for="password">비밀번호</label>
        <div class="input">
          <input class="frame-2" type="password" id="password" name="userPassword" required aria-required="true" autocomplete="new-password" />
        </div>

        <label class="text-wrapper-2" for="phone">전화번호</label>
        <div class="input">
          <input class="frame-2" type="tel" id="phone" name="phoneNumber" required aria-required="true" autocomplete="tel" />
        </div>

        <label class="text-wrapper-2" for="department">학과</label>
        <div class="input">
          <select class="frame-2" id="department" name="majorName" required aria-required="true" style="width: 100%; border: none; outline: none; background: transparent;">
            <option value="" disabled selected>학과를 선택해주세요</option>
            <option value="응용소프트웨어공학과">응용소프트웨어공학과</option>
            <option value="컴퓨터소프트웨어공학과">컴퓨터소프트웨어공학과</option>
            <option value="게임공학과">게임공학과</option>
            <option value="인공지능공학과">인공지능공학과</option>
            <option value="컴퓨터공학과">컴퓨터공학과</option>
          </select>
        </div>

        <div class="button">
          <button class="button-wrapper" type="submit">
            <span class="button-2">회원가입</span>
          </button>
        </div>
      </form>
    </section>
  </main>
</div>

<script th:if="${errorMessage != null}">
  alert('[[${errorMessage}]]');
</script>

</body>
</html>
