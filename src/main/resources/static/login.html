<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>CheckMyClass - 로그인</title>
  <link rel="stylesheet" href="/globals.css" />
  <link rel="stylesheet" href="/styleguide.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="log-in">
  <div class="view">
    <div class="check-my-class">
      <img
              class="check-my-class"
              src="/Logo_main_CheckMyClass.png"
              alt="Logo_main"
      />
    </div>
  </div>
  <div class="login">
    <form action="/login" method="POST">
      <div class="info">
        <div class="text-wrapper">학번</div>
        <input class="input" type="text" name="studentNumber" required />
        <div class="frame"></div>

        <div class="div">비밀번호</div>
        <input class="input" type="password" name="userPassword" required />
        <div class="frame"></div>
      </div>

      <div class="actions">
        <button class="button-wrapper" type="submit">
          <div class="button-2">로그인</div>
        </button>

        <nav
                class="text-link"
                role="navigation"
                aria-label="사용자 계정 관리"
        >
          <a href="/register.html" class="text-wrapper">회원가입</a>
          <a href="#password-recovery" class="text-wrapper">비밀번호 찾기</a>
        </nav>
      </div>
    </form>
  </div>
</div>

<script th:if="${message != null}">
  alert('[[${message}]]');
</script>

<script th:if="${errorMessage != null}">
  alert('[[${errorMessage}]]');
</script>

</body>
</html>
